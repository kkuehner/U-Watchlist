<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Investment Watchlist</title>
<style>
  body { font-family: sans-serif; max-width: 1200px; margin: 2rem auto; padding: 0 1rem; }
  h1 { font-size: 1.4rem; }
  h2 { font-size: 1.1rem; margin: 0; }
  .category-header { display: flex; align-items: center; gap: 0.75rem; margin-top: 2.5rem; }
  .category-header input.name-input { font-size: 1.1rem; font-weight: bold; border: 1px solid transparent; padding: 0.1rem 0.3rem; }
  .category-header input.name-input:hover, .category-header input.name-input:focus { border-color: #ccc; }
  .category-header button { font-size: 0.8rem; padding: 0.2rem 0.5rem; }
  table { border-collapse: collapse; width: 100%; margin-top: 0.75rem; }
  th, td { border: 1px solid #ccc; padding: 0.4rem 0.6rem; text-align: right; }
  th:first-child, td:first-child, th:nth-child(2), td:nth-child(2) { text-align: left; }
  th { background: #f2f2f2; }
  #add-form { display: flex; gap: 0.5rem; }
  #add-form select, #add-form button { padding: 0.4rem 0.8rem; }
  #symbol-wrap { position: relative; flex: 1; }
  #symbol-input { width: 100%; padding: 0.4rem; box-sizing: border-box; }
  #suggestions { position: absolute; top: 100%; left: 0; right: 0; background: white;
    border: 1px solid #ccc; border-top: none; z-index: 10; max-height: 220px; overflow-y: auto; }
  #suggestions div { padding: 0.4rem 0.6rem; cursor: pointer; }
  #suggestions div:hover, #suggestions div.active { background: #f2f2f2; }
  #suggestions .sym { font-weight: bold; margin-right: 0.5rem; }
  #suggestions .name { color: #666; }
  #suggestions .exch { float: right; color: #999; font-size: 0.85rem; }
  .kpi-editor { display: flex; flex-wrap: wrap; gap: 0.75rem 1.25rem; align-items: center;
    margin-top: 0.5rem; font-size: 0.9rem; background: #fafafa; border: 1px solid #eee; padding: 0.6rem 0.8rem; }
  .kpi-toggle { display: flex; align-items: center; gap: 0.35rem; }
  .kpi-toggle input[type=range] { width: 90px; }
  .rank { color: #888; font-weight: bold; width: 2rem; }
  .warn { color: #b00; font-style: italic; }
  #new-category-btn { margin-top: 1rem; }
  #new-category-panel { display: none; margin-top: 0.5rem; }
  #funnel-bar { position: sticky; bottom: 0; display: none; align-items: center; gap: 1rem;
    margin-top: 1.5rem; padding: 0.7rem 1rem; background: #222; color: white; border-radius: 6px; }
  #funnel-bar button { padding: 0.4rem 0.9rem; }
</style>
</head>
<body>

<h1>Investment Watchlist</h1>

<form id="add-form">
  <div id="symbol-wrap">
    <input id="symbol-input" placeholder="Symbol or company name" autocomplete="off">
    <div id="suggestions"></div>
  </div>
  <select id="category-input"></select>
  <button type="submit">Add</button>
</form>

<div id="categories-container"></div>

<button id="new-category-btn" type="button">+ New Category</button>
<div id="new-category-panel">
  <input id="new-category-name" placeholder="Category name">
  <div class="kpi-editor" id="new-category-kpis"></div>
  <button type="button" id="new-category-save">Create</button>
  <button type="button" id="new-category-cancel">Cancel</button>
</div>

<div id="funnel-bar">
  <span id="funnel-count"></span>
  <button type="button" id="funnel-go">Analyze selected &rarr;</button>
  <button type="button" id="funnel-clear">Clear</button>
</div>

<div id="uncategorized-section" style="display:none;">
  <h2>Uncategorized</h2>
  <p style="font-size:0.9rem; color:#666;">Waiting for you to assign a category.</p>
  <table>
    <thead>
      <tr><th>Symbol</th><th>Name</th><th>Category</th><th></th></tr>
    </thead>
    <tbody id="uncategorized-body"></tbody>
  </table>
</div>

<script>
  // --- Fixed catalog of KPIs the backend can compute. Which ones a category
  // actually uses, and how heavily, is entirely user-defined (see `categories` below).
  const KPI_INFO = {
    pe:        { label: 'P/E',         direction: 'low',  format: v => sentinel(v, 'Loss') ?? safeFixed(v, 2) },
    ps:        { label: 'P/S',         direction: 'low',  format: v => sentinel(v, 'N/A') ?? safeFixed(v, 2) },
    peg:       { label: 'PEG',         direction: 'low',  format: formatGrowthRatio },
    psg:       { label: 'PSG',         direction: 'low',  format: formatGrowthRatio },
    Rule40:    { label: 'Rule of 40',  direction: 'high', format: v => sentinel(v, 'N/A') ?? safeFixed(v, 1) },
    pb:        { label: 'P/B',         direction: 'low',  format: v => sentinel(v, 'N/A') ?? safeFixed(v, 2) },
    ROE:       { label: 'ROE',         direction: 'high', format: v => sentinel(v, 'N/A') ?? (safeFixed(v * 100, 1) + '%') },
    debtRatio: { label: 'Debt Ratio',  direction: 'low',  format: v => sentinel(v, 'Neg. Equity') ?? safeFixed(v, 2) },
  };
  const ALL_KPI_KEYS = Object.keys(KPI_INFO);

  function sentinel(value, label) {
    return value === -1 ? label : null;
  }

  // Backstop for any value that isn't a plain finite number - a formula bug producing
  // Infinity/NaN (which Jackson serializes as the *string* "Infinity"/"NaN"), a missing
  // field, whatever. Show it plainly instead of crashing the whole page on .toFixed().
  function safeFixed(value, decimals) {
    return (typeof value === 'number' && isFinite(value)) ? value.toFixed(decimals) : 'N/A';
  }

  // Excel formulas represent "not applicable" growth cases as sentinel codes
  // (see ValuationService: -1 loss, -2 negative, -3 zero baseline). Same rule here.
  function formatGrowthRatio(value) {
    if (value === -1) return 'Loss';
    if (value === -2) return 'Negative';
    if (value === -3) return '0.0';
    return safeFixed(value, 2);
  }

  // A KPI value only counts as "comparable" for coloring/ranking if it's a normal
  // finite number - not a sentinel code (-1/-2/-3) and not a nonsensical negative
  // P/E, P/B or Debt Ratio from a loss-making / negative-equity company.
  function isComparable(kpi, value) {
    if (typeof value !== 'number' || !isFinite(value)) return false;
    if (value === -1) return false; // shared "N/A" sentinel across pe/ps/pb/debtRatio/Rule40/ROE
    if ((kpi === 'peg' || kpi === 'psg') && value < 0) return false; // -2/-3 sentinels
    if ((kpi === 'pe' || kpi === 'ps' || kpi === 'pb' || kpi === 'debtRatio') && value <= 0) return false;
    return true;
  }

  function formatMarketCap(v) {
    if (typeof v !== 'number' || !isFinite(v)) return 'N/A';
    if (v >= 1e12) return (v / 1e12).toFixed(2) + 'T';
    if (v >= 1e9) return (v / 1e9).toFixed(2) + 'B';
    if (v >= 1e6) return (v / 1e6).toFixed(1) + 'M';
    return v.toFixed(0);
  }

  // --- Color scale: same idea as Excel's built-in 3-color scale (min/median/max),
  // computed fresh from whatever stocks are currently shown.
  const GREEN = [99, 190, 123], YELLOW = [255, 235, 132], RED = [248, 105, 107];

  function lerpColor(c1, c2, t) {
    const mix = c1.map((c, i) => Math.round(c + (c2[i] - c) * t));
    return `rgb(${mix.join(',')})`;
  }

  function buildColorScale(kpi, stocks) {
    const values = stocks.map(s => s[kpi]).filter(v => isComparable(kpi, v));
    if (values.length < 2) return () => '';
    values.sort((a, b) => a - b);
    const min = values[0], max = values[values.length - 1];
    const mid = values.length / 2;
    const median = values.length % 2 === 0
      ? (values[mid - 1] + values[mid]) / 2
      : values[Math.floor(mid)];
    if (min === max) return () => '';

    const lowColor = KPI_INFO[kpi].direction === 'low' ? GREEN : RED;
    const highColor = KPI_INFO[kpi].direction === 'low' ? RED : GREEN;

    return (value) => {
      if (!isComparable(kpi, value)) return '';
      if (value <= median) {
        const t = median === min ? 0 : (value - min) / (median - min);
        return lerpColor(lowColor, YELLOW, t);
      } else {
        const t = max === median ? 1 : (value - median) / (max - median);
        return lerpColor(YELLOW, highColor, t);
      }
    };
  }

  // --- Ranking score: each selected KPI is normalized to 0-1 within the group
  // (respecting its "good direction"), then combined using its weight.
  function buildScorers(kpis, stocks) {
    const scorers = {};
    for (const kpi of kpis) {
      const values = stocks.map(s => s[kpi]).filter(v => isComparable(kpi, v));
      if (values.length < 2) { scorers[kpi] = () => 0; continue; }
      const min = Math.min(...values), max = Math.max(...values);
      const direction = KPI_INFO[kpi].direction;
      scorers[kpi] = (value) => {
        if (!isComparable(kpi, value) || min === max) return 0;
        const t = (value - min) / (max - min);
        return direction === 'high' ? t : 1 - t;
      };
    }
    return scorers;
  }

  function computeScore(stock, kpiWeights, scorers) {
    let totalWeight = 0, weightedSum = 0;
    for (const kpi in kpiWeights) {
      const w = kpiWeights[kpi];
      totalWeight += w;
      weightedSum += w * scorers[kpi](stock[kpi]);
    }
    return totalWeight === 0 ? 0 : weightedSum / totalWeight;
  }

  // --- State ---
  let categories = [];             // [{id, name, kpiWeights: {kpi: weight}}, ...] from /categories
  let latestStocks = [];           // from /watchlist/valuations
  const categoryWeights = {};      // categoryId -> working copy of {kpi: weight}, edited live before Save
  const selectedSymbols = new Set(); // symbols checked for the "funnel" into the detail page

  async function loadCategories() {
    const res = await fetch('/categories');
    categories = await res.json();
    for (const cat of categories) {
      categoryWeights[cat.id] = { ...cat.kpiWeights };
    }
    renderCategoryPicker();
  }

  function renderCategoryPicker() {
    document.querySelector('#category-input').innerHTML =
      categories.map(c => `<option value="${c.id}">${c.name}</option>`).join('');
  }

  function kpiEditorHtml(categoryId, selectedWeights) {
    return ALL_KPI_KEYS.map(kpi => {
      const enabled = kpi in selectedWeights;
      const weight = selectedWeights[kpi] ?? 5;
      return `
        <label class="kpi-toggle">
          <input type="checkbox" data-kpi-toggle="${categoryId}:${kpi}" ${enabled ? 'checked' : ''}>
          ${KPI_INFO[kpi].label}
          <input type="range" min="0" max="10" value="${weight}" data-kpi-weight="${categoryId}:${kpi}"
                 style="display:${enabled ? 'inline-block' : 'none'}">
        </label>
      `;
    }).join('');
  }

  function renderCategorySection(category, stocks) {
    const kpis = ALL_KPI_KEYS.filter(k => k in categoryWeights[category.id]);
    const ok = stocks.filter(s => !s.error);
    const errored = stocks.filter(s => s.error);

    const colorScales = Object.fromEntries(kpis.map(k => [k, buildColorScale(k, ok)]));
    const scorers = buildScorers(kpis, ok);

    const ranked = ok
      .map(s => ({ ...s, score: computeScore(s, categoryWeights[category.id], scorers) }))
      .sort((a, b) => b.score - a.score);

    const rows = ranked.map((s, i) => `
      <tr>
        <td><input type="checkbox" data-select="${s.symbol}" ${selectedSymbols.has(s.symbol) ? 'checked' : ''}></td>
        <td class="rank">${i + 1}</td>
        <td>${s.symbol}</td>
        <td>${s.name ?? ''}</td>
        <td>${formatMarketCap(s.marketCap)}</td>
        ${kpis.map(kpi => `<td style="background:${colorScales[kpi](s[kpi])}">${KPI_INFO[kpi].format(s[kpi])}</td>`).join('')}
        <td>${(s.score * 100).toFixed(0)}</td>
        <td><button data-remove="${s.symbol}">Remove</button></td>
      </tr>
    `);

    const errorRows = errored.map(s => `
      <tr>
        <td></td>
        <td></td>
        <td>${s.symbol}</td>
        <td colspan="${3 + kpis.length + 1}" style="text-align:left; color:#b00;">${s.error}</td>
        <td><button data-remove="${s.symbol}">Remove</button></td>
      </tr>
    `);

    const allRows = [...rows, ...errorRows];
    const tableBody = allRows.length
      ? allRows.join('')
      : `<tr><td colspan="${5 + kpis.length + 2}">No stocks in this category yet.</td></tr>`;

    return `
      <div class="category-header">
        <input class="name-input" value="${category.name}" data-rename="${category.id}">
        <button type="button" data-save-category="${category.id}">Save</button>
        <button type="button" data-delete-category="${category.id}">Delete category</button>
      </div>
      <div class="kpi-editor" id="kpi-editor-${category.id}">
        ${kpiEditorHtml(category.id, categoryWeights[category.id])}
      </div>
      <table>
        <thead>
          <tr>
            <th></th><th></th><th>Symbol</th><th>Name</th><th>Market Cap</th>
            ${kpis.map(k => `<th>${KPI_INFO[k].label}</th>`).join('')}
            <th>Score</th><th></th>
          </tr>
        </thead>
        <tbody>${tableBody}</tbody>
      </table>
    `;
  }

  function renderUncategorized(stocks) {
    document.querySelector('#uncategorized-section').style.display = stocks.length ? '' : 'none';
    document.querySelector('#uncategorized-body').innerHTML = stocks.map(s => `
      <tr>
        <td>${s.symbol}</td>
        <td>${s.name ?? (s.error ?? '')}</td>
        <td>
          <select data-assign="${s.symbol}">
            <option value="">Assign...</option>
            ${categories.map(c => `<option value="${c.id}">${c.name}</option>`).join('')}
          </select>
        </td>
        <td><button data-remove="${s.symbol}">Remove</button></td>
      </tr>
    `).join('');
  }

  function renderAll() {
    const container = document.querySelector('#categories-container');
    container.innerHTML = categories.map(cat => {
      const stocksInCategory = latestStocks.filter(s => s.category && s.category.id === cat.id);
      return renderCategorySection(cat, stocksInCategory);
    }).join('');
    renderUncategorized(latestStocks.filter(s => !s.category));
    renderFunnelBar();
  }

  // The funnel bar just reflects `selectedSymbols` - it doesn't touch the tables,
  // so toggling a checkbox can update it without re-rendering (and losing scroll
  // position on) the whole page.
  function renderFunnelBar() {
    const bar = document.querySelector('#funnel-bar');
    bar.style.display = selectedSymbols.size > 0 ? 'flex' : 'none';
    document.querySelector('#funnel-count').textContent =
      `${selectedSymbols.size} selected: ${[...selectedSymbols].join(', ')}`;
  }

  async function loadWatchlist() {
    try {
      const res = await fetch('/watchlist/valuations');
      if (!res.ok) throw new Error('Failed to load watchlist');
      latestStocks = await res.json();
      renderAll();
    } catch (err) {
      document.querySelector('#categories-container').innerHTML = `<p class="warn">${err.message}</p>`;
    }
  }

  async function refresh() {
    await loadCategories();
    await loadWatchlist();
  }

  // --- KPI checkbox/slider interactions (delegated - the editor HTML is rebuilt on every render) ---
  document.body.addEventListener('change', async (e) => {
    if (e.target.dataset.select) {
      const symbol = e.target.dataset.select;
      if (e.target.checked) selectedSymbols.add(symbol);
      else selectedSymbols.delete(symbol);
      renderFunnelBar();
      return;
    }
    if (e.target.dataset.kpiToggle) {
      const [categoryId, kpi] = e.target.dataset.kpiToggle.split(':');
      if (e.target.checked) {
        categoryWeights[categoryId][kpi] = 5;
      } else {
        delete categoryWeights[categoryId][kpi];
      }
      renderAll();
      return;
    }
    if (e.target.dataset.assign && e.target.value) {
      const symbol = e.target.dataset.assign;
      await fetch(`/watchlist/${symbol}/category?categoryId=${e.target.value}`, { method: 'PUT' });
      loadWatchlist();
    }
  });

  document.body.addEventListener('input', (e) => {
    if (e.target.dataset.kpiWeight) {
      const [categoryId, kpi] = e.target.dataset.kpiWeight.split(':');
      categoryWeights[categoryId][kpi] = Number(e.target.value);
      renderAll();
    }
  });

  // --- Category management: rename/save, delete, create ---
  document.body.addEventListener('click', async (e) => {
    const saveId = e.target.dataset.saveCategory;
    if (saveId) {
      const name = document.querySelector(`[data-rename="${saveId}"]`).value.trim();
      await fetch(`/categories/${saveId}`, {
        method: 'PUT',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ name, kpiWeights: categoryWeights[saveId] }),
      });
      refresh();
      return;
    }
    const deleteId = e.target.dataset.deleteCategory;
    if (deleteId) {
      if (!confirm('Delete this category? Its stocks move to Uncategorized.')) return;
      await fetch(`/categories/${deleteId}`, { method: 'DELETE' });
      refresh();
      return;
    }
    const symbol = e.target.dataset.remove;
    if (symbol) {
      await fetch(`/watchlist/${symbol}`, { method: 'DELETE' });
      loadWatchlist();
    }
  });

  const newCategoryPanel = document.querySelector('#new-category-panel');
  const newCategoryKpis = document.querySelector('#new-category-kpis');
  const NEW_ID = 'new';

  document.querySelector('#new-category-btn').addEventListener('click', () => {
    categoryWeights[NEW_ID] = {};
    newCategoryKpis.innerHTML = kpiEditorHtml(NEW_ID, categoryWeights[NEW_ID]);
    document.querySelector('#new-category-name').value = '';
    newCategoryPanel.style.display = 'block';
  });

  document.querySelector('#new-category-cancel').addEventListener('click', () => {
    newCategoryPanel.style.display = 'none';
  });

  newCategoryKpis.addEventListener('change', (e) => {
    if (!e.target.dataset.kpiToggle) return;
    const [, kpi] = e.target.dataset.kpiToggle.split(':');
    if (e.target.checked) categoryWeights[NEW_ID][kpi] = 5;
    else delete categoryWeights[NEW_ID][kpi];
    newCategoryKpis.innerHTML = kpiEditorHtml(NEW_ID, categoryWeights[NEW_ID]);
  });

  newCategoryKpis.addEventListener('input', (e) => {
    if (!e.target.dataset.kpiWeight) return;
    const [, kpi] = e.target.dataset.kpiWeight.split(':');
    categoryWeights[NEW_ID][kpi] = Number(e.target.value);
  });

  document.querySelector('#new-category-save').addEventListener('click', async () => {
    const name = document.querySelector('#new-category-name').value.trim();
    if (!name) { alert('Please name the category.'); return; }
    const res = await fetch('/categories', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ name, kpiWeights: categoryWeights[NEW_ID] }),
    });
    if (res.status === 409) { alert(`A category named "${name}" already exists.`); return; }
    newCategoryPanel.style.display = 'none';
    refresh();
  });

  // --- Autocomplete: waits until typing pauses (debounce) before asking the
  // backend, so we don't fire a request on every single keystroke.
  const symbolInput = document.querySelector('#symbol-input');
  const suggestionsBox = document.querySelector('#suggestions');
  let searchDebounce = null;

  function clearSuggestions() {
    suggestionsBox.innerHTML = '';
  }

  function selectSuggestion(symbol) {
    symbolInput.value = symbol;
    clearSuggestions();
    symbolInput.focus();
  }

  symbolInput.addEventListener('input', () => {
    clearTimeout(searchDebounce);
    const query = symbolInput.value.trim();
    if (query.length < 2) { clearSuggestions(); return; }
    searchDebounce = setTimeout(async () => {
      const res = await fetch(`/stock/search?q=${encodeURIComponent(query)}`);
      if (!res.ok) return;
      const results = await res.json();
      suggestionsBox.innerHTML = results.map(r => `
        <div data-symbol="${r.symbol}">
          <span class="sym">${r.symbol}</span><span class="name">${r.name ?? ''}</span>
          <span class="exch">${r.exchange ?? ''}</span>
        </div>
      `).join('');
    }, 200);
  });

  suggestionsBox.addEventListener('click', (e) => {
    const row = e.target.closest('[data-symbol]');
    if (row) selectSuggestion(row.dataset.symbol);
  });

  // Clicking anywhere outside the input/suggestions closes the dropdown.
  document.addEventListener('click', (e) => {
    if (!e.target.closest('#symbol-wrap')) clearSuggestions();
  });

  document.querySelector('#add-form').addEventListener('submit', async (e) => {
    e.preventDefault();
    const symbol = symbolInput.value.trim().toUpperCase();
    const categoryId = document.querySelector('#category-input').value;
    if (!symbol || !categoryId) return;
    clearSuggestions();

    const res = await fetch(`/watchlist/${symbol}?categoryId=${categoryId}`, { method: 'POST' });
    if (res.status === 409) {
      alert(`${symbol} is already on your watchlist.`);
    } else if (!res.ok) {
      alert(`Could not add ${symbol}. Check the symbol is valid.`);
    }
    symbolInput.value = '';
    loadWatchlist();
  });

  document.querySelector('#funnel-go').addEventListener('click', () => {
    const symbols = [...selectedSymbols].join(',');
    window.location.href = `analysis.html?symbols=${encodeURIComponent(symbols)}`;
  });

  document.querySelector('#funnel-clear').addEventListener('click', () => {
    selectedSymbols.clear();
    renderAll(); // full re-render so every checkbox visually unchecks, not just the bar
  });

  refresh();
</script>

</body>
</html>
